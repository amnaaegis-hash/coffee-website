<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    /* 1. The container holds both the image and the text */
    .image-container {
      position: relative;
      width: 100%; /* Makes the container responsive */
      max-width: 600px; /* Limits maximum width */
    }

    /* 2. Style the image to fit the container perfectly */
    .image-container img {
      width: 100%;
      height: auto;
      display: block; /* Removes unwanted whitespace below the image */
    }

    /* 3. Position the text directly over the image */
    .overlay-text {
      position: absolute;
      
      /* Perfect centering math */
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      
      /* Typography styling */
      color: white;
      font-size: 24px;
      font-weight: bold;
      font-family: sans-serif;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7); /* Ensures legibility */
    }
  </style>
</head>
<body>

  <div class="image-container">
    <img src="images/3e7e72c5c95969cc1263b128303bdad2.jpg" alt="Scenic background">
    <div class="overlay-text">Your Text Here</div>
  </div>

</body>
</html>
